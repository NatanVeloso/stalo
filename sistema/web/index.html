<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07090c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef0f3" media="(prefers-color-scheme: light)" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Stalo</title>
    <script>
      // Tema antes do primeiro paint, para não piscar. Mesma regra de src/shared/theme/theme.store.ts.
      try {
        var saved = JSON.parse(localStorage.getItem('stalo-sistema:prefs') || '{}').state
        var theme = (saved && saved.theme) || 'system'
        if (theme === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        var px = { sm: 14, md: 16, lg: 18 }[(saved && saved.fontSize) || 'md'] || 16
        document.documentElement.style.fontSize = px + 'px'
        document.documentElement.dataset.density = (saved && saved.density) || 'comfortable'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
